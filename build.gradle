plugins {
    id 'java'
}

defaultTasks 'build'
group = 'com.github.roborescue'
version = '4.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url = uri('https://jitpack.io') }
    maven { url = uri('https://repo.enonic.com/public/') }
    maven { url = uri('https://sourceforge.net/projects/jsi/files/m2_repo') }
}

dependencies {
    implementation fileTree(dir: 'lib', include: '*.jar')
    implementation 'com.github.roborescue:rcrs-server:master-SNAPSHOT'
    implementation 'com.github.roborescue:adf-core-java:master-SNAPSHOT'
    implementation 'log4j:log4j:1.2.17'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.1'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('javadoc', Javadoc) {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.named('clean', Delete) {
    delete layout.projectDirectory.dir('bin')
    delete layout.projectDirectory.dir('precomp_data')
    delete layout.projectDirectory.dir('test-results')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:unchecked', '-Xlint:deprecation'])
}

tasks.register('launch', JavaExec) {
    classpath = files('lib', '.') + sourceSets.main.runtimeClasspath
    mainClass = 'adf.core.Main'
    maxHeapSize = '8192m'
}

apply from: 'gradle/map-logs.gradle'
